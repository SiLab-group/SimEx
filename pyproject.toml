[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simex"
version = "0.2.0"
description = "Simulation Exploration framework with MARL-based Variable Speed Limit control"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "matplotlib~=3.8.0",
    "numpy~=1.26.0",
    "scikit-learn~=1.3.0",
    "pandas~=2.2.2",
    "traci~=1.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "flake8>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["simex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
