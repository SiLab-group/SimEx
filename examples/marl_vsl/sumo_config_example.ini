[SUMO]
# Path to the SUMO network model directory
MODEL_PATH = /path/to/SimEx/model_MD/
# Path to the SUMO binary — use headless 'sumo' for training, 'sumo-gui' for visualisation
# macOS (pip install eclipse-sumo):  /path/to/.venv/lib/pythonX.Y/site-packages/sumo/bin/sumo
# macOS (Homebrew):                  /opt/homebrew/bin/sumo
# Linux:                             /usr/share/sumo/bin/sumo
SUMO_PATH = /path/to/sumo/bin/sumo

[MARL]
ROOT_PATH = /path/to/MARL_VSL_SimEx/
# Directory containing pre-trained Q/W CSV files (marl_training_file/ in this repo)
RESULTS_PATH = /path/to/SimEx/marl_training_file/
# Path to the MARL SUMO model directory (marl_model_MD/ in this repo)
MODEL_PATH = /path/to/SimEx/marl_model_MD/
RUN = 0
END = 6000
VSL = 1
